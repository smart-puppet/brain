# ReSpeaker XVF3800 — hardware AEC/DoA, Silero-gated STT, barge-in during TTS.
# See config/README.md

audio:
  # Stereo far-end for XVF3800 AEC. Keep Piper's 22.05 kHz — opening the
  # Pulse stream at 16 kHz native stalls PortAudio writes (ready prompt never
  # finishes, so the mic loop never starts). Pulse resamples 22.05 → 16 kHz.
  output_channels: 2
  respeaker:
    usb_reset_on_start: always   # auto | always | never
    reset_method: all            # firmware | usb_port | usb_cycle | both | all
    settle_ms: 3000
    pause_tts_on_speech: false   # unused: interrupt_while_speaking uses Silero holdoff
    interrupt_while_speaking: true  # Silero during TTS → pause Piper, clean STT, decode
    interrupt_timeout_ms: 1800     # resume TTS if the probe is not real user speech
    interrupt_holdoff_ms: 800      # ignore TTS-bleed spikes before pausing
    doa_debug: true              # true + logging.level DEBUG → direction logs
    doa_poll_ms: 250
    # Auto-turn chassis toward the speaker using DoA (needs drive MQTT bridge).
    # ~60° = in front; ~180° = to the robot's right.
    face_speaker: true
    doa_front_deg: 60
    doa_deadband_deg: 25         # skip tiny turns
    doa_max_turn_deg: 120
    doa_ms_per_deg: 16            # tune: larger = slower/longer spin
    doa_turn_speed: 120
    doa_invert: false            # true if left/right feel mirrored

vad:
  enabled: true       # Silero: turn start/end + STT gate (keeps TTS out of Nemotron)
  gate_stt: true      # feed Nemotron only while Silero says speech (plus STT tail)

puppet:
  barge_in_enabled: false
  interrupt_min_chars: 4
