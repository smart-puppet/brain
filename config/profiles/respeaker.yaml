# ReSpeaker XVF3800 — hardware AEC/VAD, continuous STT, smart interrupt.
# See config/README.md

audio:
  respeaker:
    usb_reset_on_start: always   # auto | always | never
    reset_method: all            # firmware | usb_port | usb_cycle | both | all
    settle_ms: 3000
    pause_tts_on_speech: false   # VAD-pause chopped Piper on the robot's own voice
    interrupt_while_speaking: true  # cancel a reply when STT hears the user (not echo)
    interrupt_timeout_ms: 1800     # if VAD-pause is on: wait ≥1 Parakeet chunk
    interrupt_holdoff_ms: 400      # if VAD-pause is on: ignore short bleed spikes
    doa_debug: true              # true + logging.level DEBUG → direction logs
    doa_poll_ms: 250
    # Auto-turn chassis toward the speaker using DoA (needs drive MQTT bridge).
    # ~60° = in front; ~180° = to the robot's right.
    face_speaker: true
    doa_front_deg: 60
    doa_deadband_deg: 25         # skip tiny turns
    doa_max_turn_deg: 120
    doa_ms_per_deg: 16            # tune: larger = slower/longer spin
    doa_turn_speed: 120
    doa_invert: false            # true if left/right feel mirrored

vad:
  enabled: true       # Silero: turn boundaries (not STT gating)
  gate_stt: false     # keep Nemotron decoding continuously

puppet:
  barge_in_enabled: false
  interrupt_min_chars: 4
