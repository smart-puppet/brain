# Speech-to-text (Nemotron via parakeet.cpp). Language from config/language/<locale>.yaml.

stt:
  backend: parakeet
  model_path: models/stt/nemotron-3.5-asr-streaming-0.6b-q8_0.gguf
  streaming:
    chunk_ms: 320        # 80 / 160 / 320 / 560 / 1120 — 320ms is live-mic; 1120 dropped short turns
    strip_lang_tags: true
  n_threads: 1
  n_batch: 1
  suspend_during_llm: false
  warmup: true
  warmup_ms: 1500
