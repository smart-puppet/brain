# Puppet base config — see config/README.md for the full guide.
profile: respeaker   # respeaker | regular-mic

audio:
  sample_rate: 16000   # fixed for STT (16 kHz int16 mono)
  channels: 1
  input_device: null   # null = default; list: python scripts/check_mic.py --list-devices
  output_device: null
  chunk_ms: 20                 # capture period; keep small (~20ms)
  output_frames_per_buffer: 512  # PortAudio write period ~23ms at 22.05 kHz
  output_write_chunk_frames: 256
  output_alsa_period_ms: 20      # Pulse ALSA period on the speaker card
  output_alsa_periods: 3         # ALSA buffer = 3 periods (~60ms); was 1s/2s
  playback_warmup_ms: 500
  speech_rms_threshold: 0.015   # used when vad.enabled: false
  respeaker:
    vendor_id: 0x2886
    product_ids: [0x001a]
    name_patterns: [respeaker, xvf3800, seeed]

logging:
  level: DEBUG   # INFO = normal; DEBUG = + stt/llm/tts trace; mouth: puppet.mouth.debug or --mouth-debug

mqtt:
  enabled: false
  # Inject eyes traversability hints into Gemma's system prompt (see ../../docs/mqtt.md).
  vision_enabled: true
  # Legacy override: if true, capture before every reply. Default false — brain only
  # requests a capture when the user prompt is about seeing the room.
  capture_before_reply: false
  broker: 127.0.0.1
  port: 1883
  topic_prefix: puppet
  scene_topic: robot/nav/scene
  capture_topic: robot/nav/capture
  capture_view: traverse
  capture_timeout_s: 60.0
  vision_min_interval_s: 1.0
  drive_cmd_topic: robot/drive/cmd
  drive_stop_topic: robot/drive/stop
  play_cmd_topic: robot/play/cmd
  play_status_topic: robot/play/status
  play_speeds_topic: robot/play/speeds

# Kid play: follow a person / hide-and-seek (needs eyes + drive MQTT bridge).
# Safety: only short dur>0 nudges; loop pauses while Kace is thinking or speaking.
play:
  enabled: true
  allow_motion: true          # set false to keep voice intents but never roll
  tick_s: 0.15
  capture_timeout_s: 8
  follow:
    stop_m: 1.5               # stay at least this far behind the person
    obstacle_m: 0.8           # hard stop if something else is closer (furniture faces sit ~0.6 m)
    sector_block_m: 0.7
    forward_speed: 105
    forward_dur_ms: 700
    backward_speed: 105
    backward_dur_ms: 500
    turn_speed: 125           # follow / face-voice rotation (Eye slider)
    seek_turn_speed: 125      # hide-and-seek search rotation (Eye slider)
    turn_dur_ms: 280
    search_turn_dur_ms: 500   # one glance, then roll (seek); follow uses this as a spin pulse
    search_turn_ticks: 1
    search_forward_ticks: 1   # turn → look/roll → turn the other way → roll
    search_forward_dur_ms: 1100
    lost_ticks: 2             # YOLO flicker wait after a tracked person vanishes
    turn_ms_per_deg: 8        # chassis calibration (same as DoA face-speaker)
    follow_spin_deg: 360      # look-around at follow start / after a 180 miss
    follow_recover_deg: 180   # turn toward the side the person left the frame
    found_m: 2.0              # hide-and-seek: person within this range counts as found
    seek_giveup_ticks: 40     # lost captures while rolling/turning → give up
    alive_jitter: 0.25        # 0 = metronome; small wander without 200ms twitches
    unstick_after: 2          # reverse after this many blocked ticks (or immediately if both sides tight)
    uturn_after: 3            # reverses without escaping → U-turn toward the freer side
    uturn_ticks: 2            # consecutive long turns (then look; roll if that side is open)
    uturn_dur_ms: 900
    min_pulse_ms: 320         # floor on jittered follow/seek pulses
